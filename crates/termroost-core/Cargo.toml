[package]
name = "termroost-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "GUI-agnostic core of TerminalRooster: projects, tabs, terminals, tasks, persistence"

[dependencies]
alacritty_terminal.workspace = true
# Same version alacritty_terminal uses; needed to wrap its PTY (see session/tap.rs).
polling = "3.8"
rusqlite.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
async-channel.workspace = true
directories.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid = { version = "1", features = ["v4"] }
toml = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
# The Files tab dims what .gitignore leaves out (listed here, so remote hosts do it too).
ignore = "0.4"
# File contents in the remote protocol's JSON.
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
# Same version alacritty_terminal uses.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Threading",
] }
