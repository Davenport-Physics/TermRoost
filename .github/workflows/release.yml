# Builds the Linux packages (.deb and .rpm).
#
# - Pushing a tag like `v0.2.0` builds them and attaches them to a GitHub
#   release for that tag (created if needed).
# - "Run workflow" on the Actions tab builds them as a downloadable artifact.
#
# Packages are built on the oldest supported Ubuntu so the binary only needs an
# older glibc and runs on older distributions too.
name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The static helper for remote hosts (cargo xtask remote).
          targets: x86_64-unknown-linux-musl

      - name: Install musl-gcc
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Build packages
        run: cargo xtask package all

      - uses: actions/upload-artifact@v4
        with:
          name: terminalrooster-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
