[workspace]
resolver = "3"
members = ["crates/termroost-core", "crates/termroost-iced", "crates/termroost-tui", "xtask"]
default-members = ["crates/termroost-core", "crates/termroost-iced", "crates/termroost-tui"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Emma Davenport <davenport.physics@gmail.com>"]
rust-version = "1.89"

[workspace.dependencies]
termroost-core = { path = "crates/termroost-core" }
alacritty_terminal = "0.26"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
directories = "6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iced = { version = "0.14", features = ["advanced", "tokio", "svg", "highlighter", "image-without-codecs"] }
rfd = "0.18"

[profile.release]
lto = "thin"
# Smaller binaries; function names stay, so logged backtraces remain readable.
strip = "debuginfo"
